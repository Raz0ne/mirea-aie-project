services:
  scoring-api:
    build: .
    image: credit-scoring-api:latest
    container_name: credit-scoring-api
    ports:
      - "8000:8000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      LOG_LEVEL: "INFO"
      MODEL_PATH: "artifacts/model.joblib"
      DECISION_THRESHOLD: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
